# Compose configuration for local Evently API service. (run with: docker compose up --build)

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: evently:local
    container_name: evently-api

    # Port mapping (host:container)
    ports:
      - "8000:8000"

    # Application environment variables with fallbacks
    environment:
      EVENTLY_APP_VERSION: ${EVENTLY_APP_VERSION:-0.1.0}
      EVENTLY_ENVIRONMENT: ${EVENTLY_ENVIRONMENT:-local}

    # Container health check using Python standard library
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    # Container restart policy
    restart: unless-stopped